[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novanx"
version = "0.1.0"
description = "The Nexa.py package registry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Nexa.py>=0.5.2", "psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
include = ["novanx*"]
